  .wordmark{
    font-size:18px;
    font-weight:700;
    letter-spacing:-.02em;
  }

  /* ---- copy ---- */
  h1{
    margin:0 0 12px;
    font-size:34px;
    line-height:1.12;
    font-weight:700;
    letter-spacing:-.03em;
  }

  .sub{
    margin:0 0 30px;
    font-size:14px;
    line-height:1.72;
    color:var(--muted);
  }

  /* ---- form ---- */
  .form{
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:center;
  }

  .email{
    flex:1 1 auto;
    max-width:320px;
    height:46px;
    padding:0 20px;
    border:0;
    border-radius:999px;
    background:var(--field);
    font:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
  }

  .email::placeholder{color:var(--placeholder);}

  .email:focus-visible{box-shadow:0 0 0 2px #0a0a0a;}

  .btn{
    flex:none;
    height:46px;
    padding:0 22px;
    border:0;
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:opacity .18s ease, transform .18s ease;
  }

  .btn:hover{opacity:.85;}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid #0a0a0a; outline-offset:3px;}

  .note{
    margin:18px 0 0;
    font-size:13px;
    color:var(--muted);
    min-height:20px;
    opacity:0;
    transition:opacity .25s ease;
  }

  .note.show{opacity:1;}

  @media (max-width:480px){
    h1{font-size:28px;}
    .form{flex-direction:column;}
    .email{width:100%; max-width:none;}
    .btn{width:100%;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>

  <main class="wrap">
    <div class="brand">
      <div class="orb" aria-hidden="true"></div>
      <span class="wordmark">noworldcoin</span>
    </div>

    <h1>Not coming soon</h1>

    <p class="sub">
      World is the Solana prediction market.<br>
      We will farm your attention.
    </p>

    <div class="form">
      <input class="email" id="email" type="email" placeholder="you@email.com" aria-label="Email address" autocomplete="off">
      <button class="btn" id="btn" type="button">Notify me</button>
    </div>

    <p class="note" id="note" role="status"></p>
  </main>

  var btn = document.getElementById('btn');
  var email = document.getElementById('email');
  var note = document.getElementById('note');

  btn.addEventListener('click', function () {
    note.textContent = email.value.trim()
      ? 'Attention farmed. Nothing was saved. Nothing is coming.'
      : 'No email needed. Your attention is already harvested.';
    note.classList.add('show');
    email.value = '';
  });
</script>
</body>
